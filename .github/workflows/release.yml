# Publish tinhead-mcp to npm using TRUSTED PUBLISHING (OIDC). No token.
#
# The runner proves its identity to npm with a short-lived, cryptographically
# signed OIDC token scoped to this exact repository and workflow. Nothing
# long-lived exists to leak, and provenance — "the source you can read is the
# code you installed" — is attested by npm rather than promised by us.
#
# NOTE: there is deliberately NO `env: NODE_AUTH_TOKEN` here. npm falls back to
# OIDC only when that variable is entirely UNSET; an empty string is still a
# value and npm will try to authenticate with it and fail.
#
# Setup, once, at npmjs.com > the package > Settings > Trusted Publisher:
#   organization/user: Tinhead-app · repository: tinhead-mcp
#   workflow: release.yml
# npm requires the package to EXIST before a trusted publisher can be added
# (npm/cli#8544), which is why 0.0.0 was published by hand once and nothing
# since has been.
#
# Token-based publishing was the plan until 2026-07-08, when GitHub announced
# that 2FA-bypass granular tokens lose direct publishing around January 2027.
# This is the path npm is steering everyone to, so it is the one to be on.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      # v4 of both still targets Node 20, which the runners now force onto 24
      # and annotate every run about. A deprecation warning on the release of a
      # package whose pitch is auditability is a bad first impression.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm CLI >= 11.5.1, and Node 22 still ships
      # 10.9.8 — which has no OIDC support at all. It does not fail loudly: it
      # never attempts OIDC, falls through to token auth it does not have, and
      # the registry rejects the unauthenticated PUT as a 404 that reads like a
      # misconfigured trusted publisher. Four releases died here.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build
      # The suites run before anything is published, not after.
      - run: npm test
      # `prepublishOnly` re-builds and runs scripts/prepublish-check.mjs, so a
      # release cannot ship while the metadata or the licence is incomplete.
      #
      # `--provenance` is redundant under trusted publishing (npm attests by
      # default) and is kept because it states the intent in the file that has
      # to hold it true.
      - run: npm publish --provenance --access public
        working-directory: packages/tinhead-mcp
